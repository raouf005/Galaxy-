<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Animation</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas.webgl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #startButton {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;

  padding: 16px 28px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 30px;

  background: rgba(20, 10, 40, 0.45);
  color: white;
  font-size: 18px;
  letter-spacing: 1px;

  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(122,60,255,0.6);
  cursor: pointer;
  }
</style>
</head>
<body>
<canvas class="webgl"></canvas>
  <audio id="bgMusic" src="music.mp3" loop></audio>
  <button id="startButton">Enter the Galaxy ✨</button>
<script>
const PARAMS = {
  count: 90000,
  radius: 5,
  branches: 3,
  spin: 1.1,
  randomness: 0.35,
  randomnessPower: 3,
  insideColor: "#ff7a3a",
  outsideColor: "#7a3cff",
  introSeconds: 7,
  size: 26
};

const canvas = document.querySelector("canvas.webgl");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false });

const vsSource = `
attribute vec3 aPos;
attribute vec3 aColor;
attribute float aScale;
uniform mat4 uViewProj;
uniform mat4 uView;
uniform float uSpin;
uniform float uSize;
varying vec3 vColor;
void main() {
  float dist = length(aPos.xz);
  float angle = atan(aPos.x, aPos.z);
  angle += uSpin / (dist * 0.6 + 0.4);
  vec3 p = vec3(sin(angle) * dist, aPos.y, cos(angle) * dist);
  vec4 view = uView * vec4(p, 1.0);
  gl_Position = uViewProj * vec4(p, 1.0);
  gl_PointSize = uSize * aScale / max(0.2, -view.z);
  vColor = aColor;
}`;

const fsSource = `
precision mediump float;
varying vec3 vColor;
void main() {
  float d = distance(gl_PointCoord, vec2(0.5));
  float a = pow(1.0 - clamp(d * 2.0, 0.0, 1.0), 3.0);
  gl_FragColor = vec4(vColor * a, a);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog);
gl.useProgram(prog);

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}
const cIn = hexToRgb(PARAMS.insideColor);
const cOut = hexToRgb(PARAMS.outsideColor);

const positions = new Float32Array(PARAMS.count * 3);
const colors = new Float32Array(PARAMS.count * 3);
const scales = new Float32Array(PARAMS.count);

for (let i = 0; i < PARAMS.count; i++) {
  const i3 = i * 3;
  const r = Math.pow(Math.random(), 1.4) * PARAMS.radius;
  const branchAngle = ((i % PARAMS.branches) / PARAMS.branches) * Math.PI * 2;
  const spinAngle = r * PARAMS.spin;

  const rnd = () =>
    Math.pow(Math.random(), PARAMS.randomnessPower) *
    (Math.random() < 0.5 ? 1 : -1) * PARAMS.randomness * r;

  positions[i3]     = Math.cos(branchAngle + spinAngle) * r + rnd();
  positions[i3 + 1] = rnd() * 0.6;
  positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + rnd();

  const t = r / PARAMS.radius;
  colors[i3]     = cIn[0] + (cOut[0] - cIn[0]) * t;
  colors[i3 + 1] = cIn[1] + (cOut[1] - cIn[1]) * t;
  colors[i3 + 2] = cIn[2] + (cOut[2] - cIn[2]) * t;

  scales[i] = 0.3 + Math.random() * 0.9;
}

function makeBuffer(data, name, size) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, name);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
}
makeBuffer(positions, "aPos", 3);
makeBuffer(colors, "aColor", 3);
makeBuffer(scales, "aScale", 1);

const uViewProj = gl.getUniformLocation(prog, "uViewProj");
const uView = gl.getUniformLocation(prog, "uView");
const uSpin = gl.getUniformLocation(prog, "uSpin");
const uSize = gl.getUniformLocation(prog, "uSize");

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.disable(gl.DEPTH_TEST);
gl.clearColor(0, 0, 0, 1);

function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
}
function lookAt(e, c, u) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
  let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
  l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return [
    xx, yx, zx, 0,
    xy, yy, zy, 0,
    xz, yz, zz, 0,
    -(xx * e[0] + xy * e[1] + xz * e[2]),
    -(yx * e[0] + yy * e[1] + yz * e[2]),
    -(zx * e[0] + zy * e[1] + zz * e[2]), 1
  ];
}
function mul(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
  return o;
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

let dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener("resize", resize);
resize();

let spin = 0, last = performance.now(), elapsed = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  elapsed += dt;

  const k = ease(Math.min(1, elapsed / PARAMS.introSeconds));
  const height = 13 - 9.5 * k;
  const distance = 0.6 + 7.4 * k;
  const orbit = 0.8 + elapsed * 0.03 * smooth(6, 14, elapsed) * 3;
  const eye = [Math.sin(orbit) * distance, height, Math.cos(orbit) * distance];

  const speed = 0.04 + 0.32 * smooth(PARAMS.introSeconds * 0.55, PARAMS.introSeconds + 4, elapsed);
  spin += dt * speed;

  const aspect = canvas.width / canvas.height;
  const fov = (aspect < 1 ? 70 : 55) * Math.PI / 180;
  const view = lookAt(eye, [0, 0, 0], [0, 1, 0]);
  const proj = perspective(fov, aspect, 0.1, 100);

  gl.uniformMatrix4fv(uView, false, new Float32Array(view));
  gl.uniformMatrix4fv(uViewProj, false, new Float32Array(mul(proj, view)));
  gl.uniform1f(uSpin, spin);
  gl.uniform1f(uSize, PARAMS.size * dpr * (canvas.height / 800));

  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, PARAMS.count);
  requestAnimationFrame(frame);
}
const startButton = document.getElementById("startButton");
const bgMusic = document.getElementById("bgMusic");

startButton.addEventListener("click", () => {
  startButton.style.display = "none";

  bgMusic.play();

  spin = 0;
  elapsed = 0;
  last = performance.now();

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
